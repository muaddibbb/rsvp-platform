<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="x-deploy" content="2" />
  <title>אישור הגעה</title>
  <link rel="stylesheet" href="/style.css" />
  <script>
    window.PAGE_I18N = {
      he: {
        pageTitle: "אישור הגעה",
        inviteText: "אתם מוזמנים לחגוג עמנו",
        loading: "טוען...",
        dateLabel: "תאריך",
        timeLabel: "שעה",
        locationLabel: "מיקום",
        notFoundTitle: "האירוע לא נמצא",
        notFoundText: "הקישור אינו תקין או שהאירוע הסתיים",
        eventNotFound: "אירוע לא נמצא",
        formTitle: "אישור הגעה",
        fullNameLabel: "שם מלא *",
        fullNamePh: "ישראל ישראלי",
        attendLabel: "האם תגיעו? *",
        attendYes: "מגיעים!",
        attendNo: "לא יכולים",
        guestCountLabel: "כמה אנשים יגיעו? *",
        notesLabel: "הערות (אופציונלי)",
        notesPh: "צרכים מיוחדים, אלרגיות, שאלות...",
        submitBtn: "שלח אישור",
        sendAnother: "שלח אישור נוסף",
        dashboardLink: "ניהול אישורים",
        footerCredit: "נוצר ע״י Kupernet Systems",
        titleSuffix: " — אישור הגעה",
        errName: "נא להזין שם מלא",
        errAttending: "נא לסמן האם תגיעו",
        sending: "שולח...",
        errSubmit: "שגיאה בשליחה",
        errSubmitRetry: "שגיאה בשליחה — נסה שוב",
        successYesTitle: "כיף שתגיעו! 🎉",
        successYesMsg: ", הרישום שלך התקבל. מחכים לראותך",
        successYesAll: " ואת כולם",
        successNoTitle: "תודה על ההענות 🙏",
        successNoMsg: ", קיבלנו את תשובתך. מקווים לראותך בפעם הבאה!"
      },
      en: {
        pageTitle: "RSVP",
        inviteText: "You are invited to celebrate with us",
        loading: "Loading...",
        dateLabel: "Date",
        timeLabel: "Time",
        locationLabel: "Location",
        notFoundTitle: "Event not found",
        notFoundText: "The link is invalid or the event has ended",
        eventNotFound: "Event not found",
        formTitle: "RSVP",
        fullNameLabel: "Full name *",
        fullNamePh: "John Smith",
        attendLabel: "Will you attend? *",
        attendYes: "We'll be there!",
        attendNo: "Can't make it",
        guestCountLabel: "How many people are coming? *",
        notesLabel: "Notes (optional)",
        notesPh: "Special needs, allergies, questions...",
        submitBtn: "Send RSVP",
        sendAnother: "Send another RSVP",
        dashboardLink: "Manage RSVPs",
        footerCredit: "Created by Kupernet Systems",
        titleSuffix: " — RSVP",
        errName: "Please enter your full name",
        errAttending: "Please select whether you will attend",
        sending: "Sending...",
        errSubmit: "Error sending RSVP",
        errSubmitRetry: "Error sending — please try again",
        successYesTitle: "So glad you're coming! 🎉",
        successYesMsg: ", your RSVP has been received. Looking forward to seeing you",
        successYesAll: " and everyone",
        successNoTitle: "Thank you for letting us know 🙏",
        successNoMsg: ", we received your reply. Hope to see you next time!"
      }
    };
  </script>
  <script src="/theme.js" defer></script>
</head>
<body>
  <div class="page">

    <!-- Header -->
    <header class="hero">
      <div class="star-of-david" id="eventEmoji">🎉</div>
      <h1 class="event-title" id="eventTitle">טוען...</h1>
      <p class="invite-text" data-i18n="inviteText">אתם מוזמנים לחגוג עמנו</p>
    </header>

    <!-- Event Details -->
    <section class="details-card" id="detailsCard" style="display:none">
      <div class="detail-row extra-note-row" id="extraNoteRow" style="display:none">
        <span class="detail-icon">💬</span>
        <div>
          <div class="detail-value" id="detailExtraNote"></div>
        </div>
      </div>
      <div class="detail-row">
        <span class="detail-icon">📅</span>
        <div>
          <div class="detail-label" data-i18n="dateLabel">תאריך</div>
          <div class="detail-value" id="detailDate"></div>
        </div>
      </div>
      <div class="detail-row">
        <span class="detail-icon">🕖</span>
        <div>
          <div class="detail-label" data-i18n="timeLabel">שעה</div>
          <div class="detail-value" id="detailTime"></div>
        </div>
      </div>
      <div class="detail-row">
        <span class="detail-icon">📍</span>
        <div>
          <div class="detail-label" data-i18n="locationLabel">מיקום</div>
          <div class="detail-value" id="detailLocation"></div>
          <div class="detail-sub" id="detailAddress"></div>
        </div>
      </div>
    </section>

    <!-- Not Found -->
    <section class="form-card" id="notFoundSection" style="display:none">
      <div style="text-align:center;padding:20px">
        <div style="font-size:3rem;margin-bottom:12px">🔍</div>
        <h2 style="color:var(--navy);margin-bottom:8px" data-i18n="notFoundTitle">האירוע לא נמצא</h2>
        <p style="color:var(--text-muted)" data-i18n="notFoundText">הקישור אינו תקין או שהאירוע הסתיים</p>
      </div>
    </section>

    <!-- RSVP Form -->
    <section class="form-card" id="formSection" style="display:none">
      <h2 class="form-title" data-i18n="formTitle">אישור הגעה</h2>

      <div class="form-group">
        <label for="fullName" data-i18n="fullNameLabel">שם מלא *</label>
        <input type="text" id="fullName" placeholder="ישראל ישראלי" data-i18n-ph="fullNamePh" autocomplete="name" />
      </div>

      <div class="form-group">
        <label data-i18n="attendLabel">האם תגיעו? *</label>
        <div class="radio-group">
          <label class="radio-card" id="radioYesCard">
            <input type="radio" name="attending" value="yes" id="radioYes" />
            <span class="radio-icon">🎉</span>
            <span data-i18n="attendYes">מגיעים!</span>
          </label>
          <label class="radio-card" id="radioNoCard">
            <input type="radio" name="attending" value="no" id="radioNo" />
            <span class="radio-icon">😔</span>
            <span data-i18n="attendNo">לא יכולים</span>
          </label>
        </div>
      </div>

      <div class="form-group" id="guestsGroup" style="display:none">
        <label for="guestCount" data-i18n="guestCountLabel">כמה אנשים יגיעו? *</label>
        <div class="counter">
          <button type="button" class="counter-btn" id="decreaseBtn">−</button>
          <span class="counter-value" id="guestCount">1</span>
          <button type="button" class="counter-btn" id="increaseBtn">+</button>
        </div>
      </div>

      <div class="form-group">
        <label for="notes" data-i18n="notesLabel">הערות (אופציונלי)</label>
        <textarea id="notes" placeholder="צרכים מיוחדים, אלרגיות, שאלות..." data-i18n-ph="notesPh" rows="3"></textarea>
      </div>

      <button class="submit-btn" id="submitBtn" onclick="submitRSVP()" data-i18n="submitBtn">שלח אישור</button>
    </section>

    <!-- Success State -->
    <section class="success-card" id="successSection" style="display:none">
      <div class="success-icon">🎊</div>
      <h2 id="successTitle"></h2>
      <p id="successMessage"></p>
      <button class="outline-btn" onclick="resetForm()" data-i18n="sendAnother">שלח אישור נוסף</button>
    </section>

    <!-- Error Banner -->
    <div class="error-banner" id="errorBanner" style="display:none">
      <span id="errorText"></span>
    </div>

    <footer class="footer" id="pageFooter" style="display:none">
      <a id="dashboardLink" href="#" class="dashboard-link" data-i18n="dashboardLink">ניהול אישורים</a>
    </footer>
  </div>

  <script>
    // Extract slug from URL path: /rsvp/[slug]
    const slug = window.location.pathname.split("/").filter(Boolean).pop();
    let guestCountValue = 1;
    let eventData = null;
    let lastSubmission = null;
    let notFoundShown = false;

    async function loadEvent() {
      if (!slug) return showNotFound();
      try {
        const res = await fetch(`/api/event/${slug}`);
        if (!res.ok) return showNotFound();
        eventData = await res.json();
        populateEvent(eventData);
      } catch (e) {
        showNotFound();
      }
    }

    function showNotFound() {
      notFoundShown = true;
      document.getElementById("eventTitle").textContent = t("eventNotFound");
      document.getElementById("notFoundSection").style.display = "block";
    }

    const EVENT_EMOJI = {
      bar_mitzvah: "🎉", bat_mitzvah: "🌸", wedding: "💍",
      brit: "👶", brit_bat: "🎀", birthday: "🎂",
      bachelor: "🕺", bachelorette: "💃",
      henna: "🪬", family: "🎊", other: "🎉",
    };

    function populateEvent(ev) {
      document.title = ev.event_name + t("titleSuffix");
      document.getElementById("eventTitle").textContent = ev.event_name;
      document.getElementById("eventEmoji").textContent = EVENT_EMOJI[ev.event_type] || "🎉";

      // Date
      const dateStr = ev.hebrew_date
        ? ev.hebrew_date + " | " + ev.gregorian_date
        : ev.gregorian_date;
      document.getElementById("detailDate").textContent = dateStr;
      document.getElementById("detailTime").textContent = ev.event_time;
      document.getElementById("detailLocation").textContent = ev.location;
      document.getElementById("detailAddress").textContent = ev.address;

      if (ev.extra_note) {
        document.getElementById("detailExtraNote").textContent = ev.extra_note;
        document.getElementById("extraNoteRow").style.display = "flex";
      }

      document.getElementById("detailsCard").style.display = "block";
      document.getElementById("formSection").style.display = "block";
      document.getElementById("pageFooter").style.display = "block";
      document.getElementById("dashboardLink").href = `/dashboard/${slug}`;
    }

    // Radio card toggle
    document.querySelectorAll('input[name="attending"]').forEach(radio => {
      radio.addEventListener("change", function () {
        document.querySelectorAll(".radio-card").forEach(c => c.classList.remove("selected"));
        this.parentElement.classList.add("selected");
        document.getElementById("guestsGroup").style.display =
          this.value === "yes" ? "block" : "none";
      });
    });

    // Guest counter
    document.getElementById("increaseBtn").addEventListener("click", () => {
      guestCountValue = Math.min(guestCountValue + 1, 20);
      document.getElementById("guestCount").textContent = guestCountValue;
    });
    document.getElementById("decreaseBtn").addEventListener("click", () => {
      guestCountValue = Math.max(guestCountValue - 1, 1);
      document.getElementById("guestCount").textContent = guestCountValue;
    });

    function showError(msg) {
      const banner = document.getElementById("errorBanner");
      document.getElementById("errorText").textContent = msg;
      banner.style.display = "block";
      setTimeout(() => (banner.style.display = "none"), 4000);
    }

    function resetForm() {
      document.getElementById("formSection").style.display = "block";
      document.getElementById("successSection").style.display = "none";
      document.getElementById("fullName").value = "";
      document.querySelectorAll('input[name="attending"]').forEach(r => (r.checked = false));
      document.querySelectorAll(".radio-card").forEach(c => c.classList.remove("selected"));
      document.getElementById("guestsGroup").style.display = "none";
      document.getElementById("notes").value = "";
      guestCountValue = 1;
      document.getElementById("guestCount").textContent = "1";
      lastSubmission = null;
    }

    async function submitRSVP() {
      const name      = document.getElementById("fullName").value.trim();
      const attending = document.querySelector('input[name="attending"]:checked');
      const notes     = document.getElementById("notes").value.trim();

      if (!name)      return showError(t("errName"));
      if (!attending) return showError(t("errAttending"));

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.textContent = t("sending");

      const payload = {
        name,
        attending: attending.value === "yes",
        guests:    attending.value === "yes" ? guestCountValue : 0,
        notes,
      };

      try {
        const res = await fetch(`/api/rsvp/${slug}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || t("errSubmit"));
        }

        document.getElementById("formSection").style.display = "none";
        const successSection = document.getElementById("successSection");
        successSection.style.display = "block";

        lastSubmission = {
          name,
          yes: attending.value === "yes",
          guests: guestCountValue,
        };
        renderSuccess();
      } catch (err) {
        showError(err.message || t("errSubmitRetry"));
      } finally {
        btn.disabled = false;
        btn.textContent = t("submitBtn");
      }
    }

    function renderSuccess() {
      if (!lastSubmission) return;
      if (lastSubmission.yes) {
        document.getElementById("successTitle").textContent = t("successYesTitle");
        document.getElementById("successMessage").textContent =
          lastSubmission.name + t("successYesMsg") + (lastSubmission.guests > 1 ? t("successYesAll") : "") + "!";
      } else {
        document.getElementById("successTitle").textContent = t("successNoTitle");
        document.getElementById("successMessage").textContent =
          lastSubmission.name + t("successNoMsg");
      }
    }

    // Re-render dynamic (JS-generated) strings when the language changes
    window.addEventListener("langchange", () => {
      if (eventData) {
        document.title = eventData.event_name + t("titleSuffix");
      } else if (notFoundShown) {
        document.getElementById("eventTitle").textContent = t("eventNotFound");
      } else {
        document.getElementById("eventTitle").textContent = t("loading");
      }
      if (lastSubmission && document.getElementById("successSection").style.display === "block") {
        renderSuccess();
      }
    });

    loadEvent();
  </script>
  <footer style="text-align:center;padding:24px;color:#9ca3af;font-size:.8rem;margin-top:32px" data-i18n="footerCredit">נוצר ע״י Kupernet Systems</footer>
</body>
</html>
