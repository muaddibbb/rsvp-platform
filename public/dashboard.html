<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>ממשק ניהול הזמנה</title>
  <link rel="stylesheet" href="/style.css" />
  <script>
    window.PAGE_I18N = {
      he: {
        pageTitle: "ממשק ניהול הזמנה",
        loginSub: "ניהול אישורי הגעה",

        exportBtn: "📥 ייצא CSV",

        guestPageLink: "🔗 דף האורחים",
        statTotal: "סה\"כ משיבים",
        statYes: "מגיעים",
        statNo: "לא מגיעים",
        statGuests: "סה\"כ אורחים",
        filterAll: "הכל",
        filterYes: "מגיעים",
        filterNo: "לא מגיעים",
        searchPh: "חיפוש לפי שם...",
        loadingData: "טוען נתונים...",
        emptyState: "אין נתונים עדיין",
        thName: "שם",
        thAttending: "הגעה",
        thGuests: "מספר אורחים",
        thNotes: "הערות",
        thTime: "זמן הרשמה",
        modalTitle: "✏️ עריכת פרטי האירוע",
        editName: "שם האירוע",
        editGregDate: "תאריך לועזי",
        editHebDate: "תאריך עברי (אופציונלי)",
        editHebDatePh: "למשל: י״ד תמוז תשפ״ו",
        editTime: "שעת האירוע",
        editLocation: "מיקום",
        editAddress: "כתובת",
        editExtraNote: "הערה נוספת (אופציונלי)",
        cancelBtn: "ביטול",
        saveBtn: "שמור שינויים",
        footerCredit: "נוצר ע״י Kupernet Systems",
        checking: "בודק...",

        badgeYes: "✅ מגיע",

        deleteTitle: "מחק",
        confirmDeletePre: "למחוק את ",

        saveErrPrefix: "שגיאה בשמירה: ",
        csvName: "שם",
        csvAttending: "הגעה",
        csvGuests: "מספר אורחים",
        csvNotes: "הערות",
        csvTime: "זמן",
        csvYes: "מגיע",
        csvNo: "לא מגיע"
      },
      en: {
        pageTitle: "Event Management Dashboard",
        loginSub: "Manage your RSVPs",
        loginFormTitle: "Sign in",
        passwordLabel: "Password",
        passwordPh: "Enter password",
        loginBtn: "Sign in",
        loginErr: "Incorrect password",
        dashSub: "RSVP list",
        refreshBtn: "🔄 Refresh",
        exportBtn: "📥 Export CSV",
        editBtn: "✏️ Edit",
        guestPageLink: "🔗 Guest page",
        statTotal: "Total responses",
        statYes: "Attending",
        statNo: "Not attending",
        statGuests: "Total guests",
        filterAll: "All",
        filterYes: "Attending",
        filterNo: "Not attending",
        searchPh: "Search by name...",
        loadingData: "Loading data...",
        emptyState: "No data yet",
        thName: "Name",
        thAttending: "Attendance",
        thGuests: "Guests",
        thNotes: "Notes",
        thTime: "Submitted at",
        modalTitle: "✏️ Edit event details",
        editName: "Event name",
        editGregDate: "Date (Gregorian)",
        editHebDate: "Hebrew date (optional)",
        editHebDatePh: "e.g. 14 Tammuz 5786",
        editTime: "Event time",
        editLocation: "Location",
        editAddress: "Address",
        editExtraNote: "Additional note (optional)",
        cancelBtn: "Cancel",
        saveBtn: "Save changes",
        footerCredit: "Created by Kupernet Systems",
        checking: "Checking...",
        serverErr: "Server error",
        errPrefix: "Error: ",
        loadError: "Error loading data",
        badgeYes: "✅ Attending",
        badgeNo: "❌ Not attending",
        deleteTitle: "Delete",
        confirmDeletePre: "Delete ",
        saving: "Saving...",
        saveErrPrefix: "Error saving: ",
        csvName: "Name",
        csvAttending: "Attendance",
        csvGuests: "Guests",
        csvNotes: "Notes",
        csvTime: "Time",
        csvYes: "Attending",
        csvNo: "Not attending"
      }
    };
  </script>
  <script src="/theme.js" defer></script>
  <style>
    .delete-btn { background:none;border:none;cursor:pointer;font-size:1rem;opacity:.35;transition:opacity .15s;padding:2px 6px;border-radius:6px; }
    .delete-btn:hover { opacity:1;background:var(--red-light); }
    .modal-overlay { display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center; }
    .modal-overlay.open { display:flex; }
    .modal { background:#fff;border-radius:16px;padding:32px;max-width:480px;width:90%;max-height:90vh;overflow-y:auto;direction:rtl; }
    .modal h2 { margin:0 0 20px;color:#1a2744;font-size:1.2rem; }
    .modal .form-group { margin-bottom:14px; }
    .modal label { display:block;font-size:.85rem;color:#6b7280;margin-bottom:4px; }
    .modal input, .modal textarea { width:100%;padding:8px 12px;border:1px solid #e5e7eb;border-radius:8px;font-size:.95rem;box-sizing:border-box;font-family:inherit; }
    .modal textarea { resize:vertical;min-height:72px; }
    .modal-actions { display:flex;gap:10px;justify-content:flex-end;margin-top:20px; }
    .btn-save { background:#1a2744;color:#fff;border:none;padding:10px 24px;border-radius:8px;cursor:pointer;font-size:.95rem; }
    .btn-save:disabled { opacity:.5;cursor:default; }
    .btn-cancel { background:#f3f4f6;color:#374151;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:.95rem; }
    /* LTR fix for the modal when English is active */
    html[dir="ltr"] .modal { direction:ltr; }
    /* Dark-mode overrides for this page's inline components */
    html.dark .modal { background:#1e293b; }
    html.dark .modal h2 { color:#e2e8f0; }
    html.dark .modal label { color:#94a3b8; }
    html.dark .modal input, html.dark .modal textarea { background:#0f172a;border-color:#334155;color:#e2e8f0; }
    html.dark .btn-save { background:#3b82f6; }
    html.dark .btn-save:disabled { opacity:.5; }
    html.dark .btn-cancel { background:#334155;color:#e2e8f0; }
    html.dark .delete-btn:hover { background:rgba(239,68,68,.25); }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div class="page" id="loginPage">
    <header class="hero hero--small">
      <div class="star-of-david">🎉</div>
      <h1 class="event-title" id="loginTitle" data-i18n="pageTitle">ממשק ניהול הזמנה</h1>
      <p class="invite-text" data-i18n="loginSub">ניהול אישורי הגעה</p>
    </header>
    <section class="form-card">
      <h2 class="form-title" data-i18n="loginFormTitle">כניסה</h2>
      <div class="form-group">
        <label for="password" data-i18n="passwordLabel">סיסמה</label>
        <input type="password" id="password" placeholder="הזן סיסמה" data-i18n-ph="passwordPh"
               onkeydown="if(event.key==='Enter') login()" />
      </div>
      <button class="submit-btn" onclick="login()" data-i18n="loginBtn">כניסה</button>
      <div class="error-banner" id="loginError"
           style="display:none;position:static;margin-top:12px;border-radius:8px;transform:none;left:auto;bottom:auto"
           data-i18n="loginErr">
        סיסמה שגויה
      </div>
    </section>
  </div>

  <!-- Dashboard -->
  <div id="dashboardPage" style="display:none">
    <div class="dashboard-header">
      <div>
        <h1 class="dash-title" id="dashTitle">ממשק ניהול הזמנה</h1>
        <p class="dash-sub" id="dashSub" data-i18n="dashSub">רשימת אישורי הגעה</p>
      </div>
      <div class="dash-actions">
        <button class="icon-btn" onclick="loadRSVPs()" title="רענן" data-i18n="refreshBtn">🔄 רענן</button>
        <button class="icon-btn" onclick="exportCSV()" title="ייצא" data-i18n="exportBtn">📥 ייצא CSV</button>
        <button class="icon-btn" onclick="openEditModal()" title="עריכת פרטים" data-i18n="editBtn">✏️ עריכה</button>
        <a href="#" id="rsvpPageLink" class="icon-btn" target="_blank" data-i18n="guestPageLink">🔗 דף האורחים</a>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card stat-total">
        <div class="stat-num" id="statTotal">0</div>
        <div class="stat-label" data-i18n="statTotal">סה"כ משיבים</div>
      </div>
      <div class="stat-card stat-yes">
        <div class="stat-num" id="statYes">0</div>
        <div class="stat-label" data-i18n="statYes">מגיעים</div>
      </div>
      <div class="stat-card stat-no">
        <div class="stat-num" id="statNo">0</div>
        <div class="stat-label" data-i18n="statNo">לא מגיעים</div>
      </div>
      <div class="stat-card stat-guests">
        <div class="stat-num" id="statGuests">0</div>
        <div class="stat-label" data-i18n="statGuests">סה"כ אורחים</div>
      </div>
    </div>

    <!-- Filter -->
    <div class="filter-row">
      <button class="filter-btn active" data-filter="all"  onclick="setFilter('all', this)" data-i18n="filterAll">הכל</button>
      <button class="filter-btn"        data-filter="yes"  onclick="setFilter('yes', this)" data-i18n="filterYes">מגיעים</button>
      <button class="filter-btn"        data-filter="no"   onclick="setFilter('no', this)" data-i18n="filterNo">לא מגיעים</button>
      <input type="text" class="search-input" id="searchInput"
             placeholder="חיפוש לפי שם..." data-i18n-ph="searchPh" oninput="renderTable()" />
    </div>

    <!-- Table -->
    <div class="table-wrap">
      <div class="loading" id="loadingState" data-i18n="loadingData">טוען נתונים...</div>
      <div class="empty-state" id="emptyState" style="display:none" data-i18n="emptyState">אין נתונים עדיין</div>
      <table class="rsvp-table" id="rsvpTable" style="display:none">
        <thead>
          <tr>
            <th>#</th>
            <th data-i18n="thName">שם</th>
            <th data-i18n="thAttending">הגעה</th>
            <th data-i18n="thGuests">מספר אורחים</th>
            <th data-i18n="thNotes">הערות</th>
            <th data-i18n="thTime">זמן הרשמה</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Edit Event Modal -->
  <div class="modal-overlay" id="editModal" onclick="if(event.target===this)closeEditModal()">
    <div class="modal">
      <h2 data-i18n="modalTitle">✏️ עריכת פרטי האירוע</h2>
      <div class="form-group">
        <label data-i18n="editName">שם האירוע</label>
        <input type="text" id="edit_event_name" />
      </div>
      <div class="form-group">
        <label data-i18n="editGregDate">תאריך לועזי</label>
        <input type="date" id="edit_gregorian_date" />
      </div>
      <div class="form-group">
        <label data-i18n="editHebDate">תאריך עברי (אופציונלי)</label>
        <input type="text" id="edit_hebrew_date" placeholder="למשל: י״ד תמוז תשפ״ו" data-i18n-ph="editHebDatePh" />
      </div>
      <div class="form-group">
        <label data-i18n="editTime">שעת האירוע</label>
        <input type="time" id="edit_event_time" />
      </div>
      <div class="form-group">
        <label data-i18n="editLocation">מיקום</label>
        <input type="text" id="edit_location" />
      </div>
      <div class="form-group">
        <label data-i18n="editAddress">כתובת</label>
        <input type="text" id="edit_address" />
      </div>
      <div class="form-group">
        <label data-i18n="editExtraNote">הערה נוספת (אופציונלי)</label>
        <textarea id="edit_extra_note"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeEditModal()" data-i18n="cancelBtn">ביטול</button>
        <button class="btn-save" id="editSaveBtn" onclick="saveEventDetails()" data-i18n="saveBtn">שמור שינויים</button>
      </div>
    </div>
  </div>

  <script>
    const slug = window.location.pathname.split("/").filter(Boolean).pop();
    let allRSVPs = [];
    let currentFilter = "all";
    let storedPassword = sessionStorage.getItem("dash_pw_" + slug) || "";
    let currentEvent = {};

    document.getElementById("rsvpPageLink").href = `/rsvp/${slug}`;

    if (storedPassword) attemptAutoLogin();

    async function attemptAutoLogin() {
      try {
        const res = await fetch(`/api/dashboard/${slug}?password=${encodeURIComponent(storedPassword)}`);
        if (!res.ok) { storedPassword = ""; sessionStorage.removeItem("dash_pw_" + slug); return; }
        const data = await res.json();
        showDashboard(data);
      } catch (e) { /* network error — stay on login */ }
    }

    async function login() {
      const pw = document.getElementById("password").value;
      if (!pw) return;

      const btn = document.querySelector("#loginPage .submit-btn");
      btn.disabled = true;
      btn.textContent = t("checking");

      try {
        const res = await fetch(`/api/dashboard/${slug}?password=${encodeURIComponent(pw)}`);
        if (res.status === 401) {
          document.getElementById("loginError").style.display = "block";
          btn.disabled = false;
          btn.textContent = t("loginBtn");
          return;
        }
        if (!res.ok) throw new Error(t("serverErr"));

        storedPassword = pw;
        sessionStorage.setItem("dash_pw_" + slug, pw);
        showDashboard(await res.json());
      } catch (e) {
        alert(t("errPrefix") + e.message);
        btn.disabled = false;
        btn.textContent = t("loginBtn");
      }
    }

    function showDashboard(data) {
      if (data.event) {
        document.getElementById("dashTitle").textContent = data.event.event_name || t("pageTitle");
        document.getElementById("dashSub").textContent = t("dashSub");
      }
      document.getElementById("loginPage").style.display = "none";
      document.getElementById("dashboardPage").style.display = "block";
      processData(data);
    }

    async function loadRSVPs() {
      document.getElementById("loadingState").style.display = "block";
      document.getElementById("rsvpTable").style.display = "none";
      document.getElementById("emptyState").style.display = "none";

      try {
        const res = await fetch(`/api/dashboard/${slug}?password=${encodeURIComponent(storedPassword)}`);
        if (!res.ok) throw new Error(t("serverErr"));
        const data = await res.json();
        processData(data);
      } catch (e) {
        document.getElementById("loadingState").textContent = t("loadError");
      }
    }

    function processData(data) {
      if (data.event) currentEvent = data.event;
      allRSVPs = data.rsvps || [];
      const stats = data.stats || {};
      document.getElementById("statTotal").textContent  = stats.total       || allRSVPs.length;
      document.getElementById("statYes").textContent    = stats.attending   || allRSVPs.filter(r => r.attending === "yes").length;
      document.getElementById("statNo").textContent     = stats.notAttending || allRSVPs.filter(r => r.attending !== "yes").length;
      document.getElementById("statGuests").textContent = stats.totalGuests  || allRSVPs.filter(r => r.attending === "yes").reduce((s, r) => s + (parseInt(r.guests) || 0), 0);
      renderTable();
    }

    async function deleteRSVP(idx) {
      const entry = allRSVPs[idx];
      if (!entry) return;
      if (!confirm(t("confirmDeletePre") + `"${entry.name}"?`)) return;

      // Optimistic update
      allRSVPs.splice(idx, 1);
      renderTable();
      updateStats();

      try {
        await fetch(`/api/dashboard/${slug}?id=${entry.id}&password=${encodeURIComponent(storedPassword)}`, {
          method: "DELETE",
        });
      } catch (e) {
        // Reload to sync
        setTimeout(loadRSVPs, 500);
      }
    }

    function updateStats() {
      const yes = allRSVPs.filter(r => r.attending === "yes");
      document.getElementById("statTotal").textContent  = allRSVPs.length;
      document.getElementById("statYes").textContent    = yes.length;
      document.getElementById("statNo").textContent     = allRSVPs.length - yes.length;
      document.getElementById("statGuests").textContent = yes.reduce((s, r) => s + (parseInt(r.guests) || 0), 0);
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderTable();
    }

    function renderTable() {
      const search = document.getElementById("searchInput").value.toLowerCase();
      const filtered = allRSVPs
        .map((r, i) => ({ ...r, _idx: i }))
        .filter(r => {
          const matchFilter = currentFilter === "all" || r.attending === currentFilter;
          const matchSearch = r.name.toLowerCase().includes(search);
          return matchFilter && matchSearch;
        });

      document.getElementById("loadingState").style.display = "none";

      if (filtered.length === 0) {
        document.getElementById("emptyState").style.display = "block";
        document.getElementById("rsvpTable").style.display = "none";
        return;
      }

      document.getElementById("emptyState").style.display = "none";
      document.getElementById("rsvpTable").style.display = "table";

      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = filtered.map((r, i) => `
        <tr>
          <td class="cell-num">${i + 1}</td>
          <td class="cell-name">${escHtml(r.name)}</td>
          <td>
            <span class="badge ${r.attending === "yes" ? "badge-yes" : "badge-no"}">
              ${r.attending === "yes" ? t("badgeYes") : t("badgeNo")}
            </span>
          </td>
          <td class="cell-center">${r.attending === "yes" ? (r.guests || 1) : "—"}</td>
          <td class="cell-notes">${escHtml(r.notes || "")}</td>
          <td class="cell-time">${escHtml(r.timestamp || "")}</td>
          <td class="cell-center">
            <button class="delete-btn" onclick="deleteRSVP(${r._idx})" title="${t("deleteTitle")}">🗑️</button>
          </td>
        </tr>`
      ).join("");
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function openEditModal() {
      document.getElementById("edit_event_name").value    = currentEvent.event_name    || "";
      document.getElementById("edit_gregorian_date").value = currentEvent.gregorian_date || "";
      document.getElementById("edit_hebrew_date").value   = currentEvent.hebrew_date   || "";
      document.getElementById("edit_event_time").value    = currentEvent.event_time    || "";
      document.getElementById("edit_location").value      = currentEvent.location      || "";
      document.getElementById("edit_address").value       = currentEvent.address       || "";
      document.getElementById("edit_extra_note").value    = currentEvent.extra_note    || "";
      document.getElementById("editModal").classList.add("open");
    }

    function closeEditModal() {
      document.getElementById("editModal").classList.remove("open");
    }

    async function saveEventDetails() {
      const btn = document.getElementById("editSaveBtn");
      btn.disabled = true;
      btn.textContent = t("saving");

      const updates = {
        event_name:     document.getElementById("edit_event_name").value.trim(),
        gregorian_date: document.getElementById("edit_gregorian_date").value,
        hebrew_date:    document.getElementById("edit_hebrew_date").value.trim(),
        event_time:     document.getElementById("edit_event_time").value,
        location:       document.getElementById("edit_location").value.trim(),
        address:        document.getElementById("edit_address").value.trim(),
        extra_note:     document.getElementById("edit_extra_note").value.trim(),
      };

      try {
        const res = await fetch(`/api/dashboard/${slug}?password=${encodeURIComponent(storedPassword)}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(updates),
        });
        if (!res.ok) throw new Error(t("serverErr"));
        Object.assign(currentEvent, updates);
        document.getElementById("dashTitle").textContent = updates.event_name || currentEvent.event_name;
        closeEditModal();
      } catch (e) {
        alert(t("saveErrPrefix") + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = t("saveBtn");
      }
    }

    function exportCSV() {
      const headers = [t("csvName"), t("csvAttending"), t("csvGuests"), t("csvNotes"), t("csvTime")];
      const rows = allRSVPs.map(r => [
        r.name,
        r.attending === "yes" ? t("csvYes") : t("csvNo"),
        r.attending === "yes" ? r.guests : 0,
        r.notes || "",
        r.timestamp || "",
      ]);
      const csv = [headers, ...rows]
        .map(row => row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(","))
        .join("\n");

      const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `rsvp-${slug}.csv`;
      a.click();
    }

    // Re-render JS-generated strings (table badges, delete titles, fallback title)
    // when the language changes. Guarded so it never runs before login/data load.
    window.addEventListener("langchange", () => {
      if (document.getElementById("dashboardPage").style.display !== "block") return;
      try {
        if (currentEvent && !currentEvent.event_name) {
          document.getElementById("dashTitle").textContent = t("pageTitle");
        }
        renderTable();
      } catch (e) { /* ignore — data not loaded yet */ }
    });
  </script>
  <footer style="text-align:center;padding:24px;color:#9ca3af;font-size:.8rem;margin-top:32px" data-i18n="footerCredit">נוצר ע״י Kupernet Systems</footer>
</body>
</html>
